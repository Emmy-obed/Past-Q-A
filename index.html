<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Past Questions Bank</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#153029">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
  :root{
    --board:#153029;
    --board-2:#1c3c33;
    --chalk:#F1EFE4;
    --chalk-dim:#B9C4BC;
    --yellow:#E8C468;
    --red:#C1443C;
    --blue:#7FA3C0;
    --rule:rgba(241,239,228,0.14);
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top left, var(--board-2), var(--board) 60%);
    color:var(--chalk);
    font-family:'Inter',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    min-height:100dvh;
    padding:24px;
  }
  .app{
    width:100%;
    max-width:640px;
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.08));
    border:1px solid var(--rule);
    border-radius:14px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    height:min(88vh,760px);
    height:min(88dvh,760px);
  }
  header{
    padding:20px 24px 16px;
    border-bottom:1px dashed var(--rule);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  header h1{
    font-family:'Kalam',cursive;
    font-size:1.4rem;
    margin:0;
    color:var(--yellow);
    letter-spacing:0.3px;
  }
  header .sub{
    font-size:0.72rem;
    color:var(--chalk-dim);
    margin-top:2px;
  }
  #refreshBtn, #changeProfileBtn{
    background:none;
    border:1px solid var(--rule);
    color:var(--chalk-dim);
    font-family:'IBM Plex Mono',monospace;
    font-size:0.7rem;
    padding:6px 10px;
    border-radius:8px;
    cursor:pointer;
  }
  header .header-actions{
    display:flex;
    gap:8px;
  }
  #refreshBtn:hover, #changeProfileBtn:hover{color:var(--chalk);border-color:var(--chalk-dim);}
  #refreshBtn:focus-visible, #changeProfileBtn:focus-visible, .chip:focus-visible, #sendBtn:focus-visible, #textInput:focus-visible{
    outline:2px solid var(--yellow); outline-offset:2px;
  }

  /* ---- Login screen ---- */
  .login-screen{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:
      radial-gradient(ellipse at top left, var(--board-2), var(--board) 60%);
  }
  .login-card{
    width:100%;
    max-width:400px;
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.08));
    border:1px solid var(--rule);
    border-radius:14px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
    padding:28px 26px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .login-card h1{
    font-family:'Kalam',cursive;
    font-size:1.5rem;
    color:var(--yellow);
    margin:0 0 4px;
    text-align:center;
  }
  .login-sub{
    color:var(--chalk-dim);
    font-size:0.85rem;
    text-align:center;
    margin:0 0 18px;
  }
  .login-card label{
    color:var(--chalk-dim);
    font-size:0.78rem;
    margin:10px 0 5px;
  }
  .login-card input, .login-card select{
    background:rgba(241,239,228,0.06);
    border:1px solid var(--rule);
    color:var(--chalk);
    padding:11px 13px;
    border-radius:10px;
    font-family:'Inter',sans-serif;
    font-size:0.94rem;
  }
  .login-card select{ color-scheme:dark; }
  .login-card input:focus, .login-card select:focus{
    outline:2px solid var(--yellow); outline-offset:1px;
  }
  .login-card button[type="submit"]{
    margin-top:20px;
    background:var(--yellow);
    color:#1c1a0f;
    border:none;
    font-weight:600;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    font-size:0.95rem;
  }
  .login-card button[type="submit"]:hover{filter:brightness(1.06);}

  .install-banner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 20px;
    background:rgba(232,196,104,0.12);
    border-bottom:1px dashed var(--rule);
    font-size:0.82rem;
    color:var(--chalk);
  }
  .install-banner button{
    font-family:'Inter',sans-serif;
    font-size:0.78rem;
    border-radius:8px;
    cursor:pointer;
    border:none;
    padding:6px 12px;
  }
  #dismissInstallBtn{
    background:transparent;
    color:var(--chalk-dim);
    padding:6px 8px;
  }
  #dismissInstallBtn:hover{color:var(--chalk);}

  #chatLog{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-y;
    overscroll-behavior:contain;
    padding:22px 24px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .msg{
    max-width:86%;
    padding:12px 14px;
    border-radius:12px;
    line-height:1.5;
    font-size:0.94rem;
    white-space:pre-wrap;
    animation:rise .25s ease;
  }
  @keyframes rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .bot{
    align-self:flex-start;
    background:rgba(241,239,228,0.06);
    border:1px solid var(--rule);
    border-top-left-radius:2px;
  }
  .user{
    align-self:flex-end;
    background:rgba(126,163,192,0.18);
    border:1px solid rgba(127,163,192,0.35);
    border-top-right-radius:2px;
    color:var(--chalk);
  }
  .qa-card{
    align-self:flex-start;
    max-width:96%;
    width:100%;
    background:var(--chalk);
    color:#20241d;
    border-radius:10px;
    padding:18px 20px;
    position:relative;
    box-shadow:0 12px 24px -10px rgba(0,0,0,0.5);
    animation:rise .3s ease;
  }
  .qa-card .code{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.72rem;
    color:#5b6b60;
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin-bottom:6px;
  }
  .qa-card .q-label{
    font-family:'Kalam',cursive;
    font-size:1.05rem;
    color:#1c3c33;
    margin-bottom:4px;
  }
  .qa-card .q-text{
    font-size:0.95rem;
    margin-bottom:14px;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    line-height:1.55;
  }
  .qa-card hr{
    border:none;
    border-top:1px dashed #c9c2ac;
    margin:12px 0;
  }
  .qa-card .a-label{
    font-family:'Kalam',cursive;
    color:var(--red);
    font-size:1.02rem;
    margin-bottom:4px;
  }
  .qa-card .a-text{
    font-size:0.95rem;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    line-height:1.6;
    max-height:320px;
    overflow-y:auto;
    padding-right:6px;
    background:
      linear-gradient(#F1EFE4 30%, rgba(241,239,228,0)),
      linear-gradient(rgba(241,239,228,0), #F1EFE4 70%) 0 100%,
      radial-gradient(farthest-side at 50% 0, rgba(28,60,51,.25), rgba(28,60,51,0)) 0 0,
      radial-gradient(farthest-side at 50% 100%, rgba(28,60,51,.25), rgba(28,60,51,0)) 0 100%;
    background-repeat:no-repeat;
    background-size:100% 24px, 100% 24px, 100% 10px, 100% 10px;
    background-attachment:local, local, scroll, scroll;
  }
  .qa-card .a-text,
  .qa-card .calc-block,
  .qa-card .calc-table-wrap{
    scrollbar-width:thin;
    scrollbar-color:#8a9c92 #e7e3d3;
  }
  .qa-card .a-text::-webkit-scrollbar,
  .qa-card .calc-block::-webkit-scrollbar,
  .qa-card .calc-table-wrap::-webkit-scrollbar{
    width:8px;
    height:8px;
  }
  .qa-card .a-text::-webkit-scrollbar-track,
  .qa-card .calc-block::-webkit-scrollbar-track,
  .qa-card .calc-table-wrap::-webkit-scrollbar-track{
    background:#e7e3d3;
    border-radius:8px;
  }
  .qa-card .a-text::-webkit-scrollbar-thumb,
  .qa-card .calc-block::-webkit-scrollbar-thumb,
  .qa-card .calc-table-wrap::-webkit-scrollbar-thumb{
    background:#8a9c92;
    border-radius:8px;
  }
  .qa-card .a-para{
    margin:0 0 12px 0;
  }
  .qa-card .a-para:last-child{
    margin-bottom:0;
  }
  .qa-card .calc-table{
    width:100%;
    border-collapse:collapse;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.82rem;
    margin-top:2px;
  }
  .qa-card .calc-table-wrap{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    border:1px solid rgba(28,60,51,0.15);
    border-radius:8px;
    margin-bottom:12px;
  }
  .qa-card .a-text > .calc-table-wrap:last-child{
    margin-bottom:0;
  }
  .qa-card .calc-table th, .qa-card .calc-table td{
    border:1px solid rgba(28,60,51,0.15);
    padding:8px 10px;
    text-align:left;
    white-space:nowrap;
  }
  .qa-card .calc-table th{
    background:rgba(28,60,51,0.08);
    color:#1c3c33;
    font-weight:600;
  }
  .qa-card .calc-table tr:nth-child(even) td{
    background:rgba(28,60,51,0.03);
  }
  .qa-card .calc-block{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.82rem;
    line-height:1.5;
    white-space:pre;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    background:#eae6d9;
    border:1px solid rgba(28,60,51,0.12);
    border-radius:8px;
    padding:12px 14px;
    margin-bottom:12px;
  }
  .qa-card .a-text > .calc-block:last-child{
    margin-bottom:0;
  }
  .stamp{
    position:absolute;
    top:14px;
    right:16px;
    font-family:'Kalam',cursive;
    font-weight:700;
    font-size:0.75rem;
    color:var(--red);
    border:2px solid var(--red);
    border-radius:999px;
    padding:3px 10px;
    transform:rotate(8deg);
    opacity:0.85;
  }
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-self:flex-start;
    max-width:96%;
  }
  .chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.8rem;
    background:rgba(232,196,104,0.12);
    border:1px solid rgba(232,196,104,0.4);
    color:var(--yellow);
    padding:6px 12px;
    border-radius:999px;
    cursor:pointer;
  }
  .chip:hover{background:rgba(232,196,104,0.22);}

  form#inputRow{
    display:flex;
    gap:10px;
    padding:16px 20px;
    border-top:1px dashed var(--rule);
  }
  #textInput{
    flex:1;
    background:rgba(241,239,228,0.06);
    border:1px solid var(--rule);
    color:var(--chalk);
    padding:11px 14px;
    border-radius:10px;
    font-family:'Inter',sans-serif;
    font-size:0.94rem;
  }
  #textInput::placeholder{color:var(--chalk-dim);}
  #sendBtn{
    background:var(--yellow);
    color:#1c1a0f;
    border:none;
    font-weight:600;
    padding:0 18px;
    border-radius:10px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  #sendBtn:hover{filter:brightness(1.06);}
  #sendBtn:disabled, #textInput:disabled{opacity:0.5;cursor:not-allowed;}

  .typing{display:flex;gap:4px;align-self:flex-start;padding:12px 14px;}
  .typing span{width:6px;height:6px;background:var(--chalk-dim);border-radius:50%;animation:blink 1.2s infinite ease-in-out;}
  .typing span:nth-child(2){animation-delay:.2s;}
  .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.2;}40%{opacity:1;}}

  @media (prefers-reduced-motion: reduce){
    .msg,.qa-card{animation:none;}
    .typing span{animation:none;}
  }

  @media (max-width: 480px){
    body{ padding:0; }
    .app{
      max-width:100%;
      height:100vh;
      height:100dvh;
      border-radius:0;
    }
    .login-screen{ padding:0; align-items:stretch; }
    .login-card{ max-width:100%; border-radius:0; justify-content:center; }
  }
  .qa-card.protected{
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  .qa-card .wm{
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    pointer-events:none;
    border-radius:10px;
    z-index:2;
    background-repeat:repeat;
  }
  @media print{
    #chatLog{ display:none !important; }
    body::after{ content:"Printing is turned off for this app."; color:#000; }
  }
</style>

<script>
/* =====================================================================
   ADMIN SETUP
   1. Deploy the backend (backend-code.txt) as a Google Apps Script web app.
   2. Paste its Web app URL (it ends in /exec) into API_URL below.
   3. Keep your Google Sheet PRIVATE (Share -> Restricted). Only the backend reads it.
   Your Paystack SECRET key lives in the backend's Script properties and
   NEVER in this file. Only the PUBLIC key (pk_...) goes here.
   The free-question limit, price check and subscription length are enforced
   by the backend. The price below sets the amount Paystack charges, so if you
   change it, also change MIN_AMOUNT_KOBO in the backend (price x 100).
   ===================================================================== */
const API_URL = "https://script.google.com/macros/s/AKfycbyc0pgPA95q_pinzNPWriXBemEA_ofNHB8Egc5ouA-qqN_GQMlyAl3w2Nu4urHFxJ3j/exec";
const PAYSTACK_PUBLIC_KEY = "pk_test_72b5a4fc6cdda0c1df54a23bee6be7d48d5cf889";
const SUBSCRIPTION_PRICE_NGN = 5500;
const SUBSCRIPTION_DAYS = 30;
// Puts the student's name + a tracing tag on every answer, and blocks copy/long-press/print on answers.
// Set to false to turn all of that off.
const PROTECT_ANSWERS = true;
/* ===================================================================== */

const chatLog   = document.getElementById('chatLog');
const form       = document.getElementById('inputRow');
const textInput  = document.getElementById('textInput');
const sendBtn    = document.getElementById('sendBtn');
const refreshBtn = document.getElementById('refreshBtn');
const loginScreen = document.getElementById('loginScreen');
const appScreen = document.getElementById('appScreen');
const loginForm = document.getElementById('loginForm');
const loginName = document.getElementById('loginName');
const loginLevel = document.getElementById('loginLevel');
const loginSchool = document.getElementById('loginSchool');
const changeProfileBtn = document.getElementById('changeProfileBtn');

let bank = [];        // parsed rows from the sheet
let state = 'loading'; // loading -> course -> qnum -> next
let studentName = '';
let studentLevel = '';
let studentSchool = '';
let currentCourseRows = [];
let currentCourseLabel = '';
let currentSearchRows = [];   // rows to search question numbers within (course, optionally filtered by year)
let currentYearLabel = '';
let hasYearColumn = false;
let hasSchoolColumn = false;
let hasLevelColumn = false;
let pendingPaidRow = null;


function addBotMessage(text){
  const el = document.createElement('div');
  el.className = 'msg bot';
  el.textContent = text;
  chatLog.appendChild(el);
  scrollDown();
}
function addUserMessage(text){
  const el = document.createElement('div');
  el.className = 'msg user';
  el.textContent = text;
  chatLog.appendChild(el);
  scrollDown();
}
function addTyping(){
  const el = document.createElement('div');
  el.className = 'typing';
  el.id = 'typingIndicator';
  el.innerHTML = '<span></span><span></span><span></span>';
  chatLog.appendChild(el);
  scrollDown();
  return el;
}
function removeTyping(){
  const t = document.getElementById('typingIndicator');
  if(t) t.remove();
}
function addChips(labels, onClick){
  const wrap = document.createElement('div');
  wrap.className = 'chips';
  labels.forEach(l=>{
    const c = document.createElement('div');
    c.className = 'chip';
    c.textContent = l;
    c.tabIndex = 0;
    c.onclick = () => onClick(l);
    c.onkeydown = (e) => { if(e.key==='Enter') onClick(l); };
    wrap.appendChild(c);
  });
  chatLog.appendChild(wrap);
  scrollDown();
}
function looksTabular(text){
  const t = String(text || '');
  return t.includes('\t') || /( {2,}\S.*\n){2,}/.test(t) || /\n {2,}/.test(t);
}
function splitAnswerSegments(text){
  // Groups consecutive lines into 'table' segments (contain |) and 'text' segments (don't),
  // preserving order so nothing is dropped — unlike a filter-only approach.
  const lines = String(text || '').split('\n');
  const segments = [];
  let current = null;
  for(const raw of lines){
    const trimmed = raw.trim();
    if(!trimmed){
      if(current && current.type === 'text') current.lines.push('');
      continue;
    }
    const isPipe = trimmed.includes('|');
    const type = isPipe ? 'table' : 'text';
    if(!current || current.type !== type){
      current = { type, lines: [] };
      segments.push(current);
    }
    current.lines.push(trimmed);
  }
  return segments;
}
function renderPipeTable(lines){
  if(lines.length < 2) return null; // need a header + at least one row to count as a real table
  const rows = lines.map(l => l.split('|').map(c => c.trim()));
  const [header, ...body] = rows;
  const thead = `<tr>${header.map(h => `<th>${escapeHtml(h)}</th>`).join('')}</tr>`;
  const tbody = body.map(r => `<tr>${r.map(c => `<td>${escapeHtml(c)}</td>`).join('')}</tr>`).join('');
  return `<div class="calc-table-wrap"><table class="calc-table"><thead>${thead}</thead><tbody>${tbody}</tbody></table></div>`;
}
function renderAnswerBlock(text){
  const segments = splitAnswerSegments(text);
  const parts = segments.map(seg => {
    if(seg.type === 'table'){
      const table = renderPipeTable(seg.lines);
      if(table) return table;
      // a lone '|' line isn't a real table — fall through and show it as text
    }
    const joined = seg.lines.join('\n').trim();
    if(!joined) return '';
    return looksTabular(joined)
      ? `<pre class="calc-block">${escapeHtml(joined)}</pre>`
      : `<p class="a-para">${escapeHtml(joined)}</p>`;
  });
  return `<div class="a-text">${parts.join('')}</div>`;
}
function maskEmail(e){
  const parts = String(e || '').split('@');
  if(parts.length !== 2 || !parts[1]) return '';
  return parts[0].slice(0, 2) + '***@' + parts[1];
}
function rememberEmail(email){
  try{ localStorage.setItem('pastq_email', email); }catch(err){}
}
function watermarkLabel(){
  let email = '';
  try{ email = localStorage.getItem('pastq_email') || ''; }catch(err){}
  const who = studentName || 'Student';
  const tag = email ? maskEmail(email) : 'ID ' + getDeviceId().slice(0, 6);
  return who + ' · ' + tag;
}
// A faint, repeated diagonal label across the whole answer card, so any screenshot shows whose it is.
function makeWatermark(){
  const label = escapeHtml(watermarkLabel());
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="170">' +
    '<text x="150" y="85" text-anchor="middle" transform="rotate(-25 150 85)" ' +
    'font-family="Arial,sans-serif" font-size="14" fill="#153029" fill-opacity="0.17">' + label + '</text></svg>';
  const uri = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg)
    .replace(/'/g, '%27').replace(/\(/g, '%28').replace(/\)/g, '%29');
  const el = document.createElement('div');
  el.className = 'wm';
  el.style.backgroundImage = 'url("' + uri + '")';
  return el;
}
function addQACard(row){
  const card = document.createElement('div');
  card.className = 'qa-card' + (PROTECT_ANSWERS ? ' protected' : '');
  const yearBit = row.year ? ` · ${escapeHtml(row.year)}` : '';
  card.innerHTML = `
    <div class="stamp">✓ found</div>
    <div class="code">${escapeHtml(row.courseCode)} · Q${escapeHtml(row.qNumber)}${yearBit}</div>
    <div class="q-label">Question</div>
    <div class="q-text">${escapeHtml(row.question)}</div>
    <hr>
    <div class="a-label">Answer</div>
    ${renderAnswerBlock(row.answer)}
  `;
  if(PROTECT_ANSWERS) card.appendChild(makeWatermark());
  chatLog.appendChild(card);
  scrollDown();
}
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function scrollDown(){
  requestAnimationFrame(()=>{ chatLog.scrollTop = chatLog.scrollHeight; });
}
function setInputEnabled(on, placeholder){
  textInput.disabled = !on;
  sendBtn.disabled = !on;
  if(placeholder) textInput.placeholder = placeholder;
  if(on) textInput.focus();
}

/* ---- Talking to the secure backend ---- */
const DEVICE_KEY = 'pastq_device';
const TOKEN_KEY = 'pastq_token';
const CATALOG_KEY = 'pastq_catalog_v2';
const CATALOG_TTL_MS = 10 * 60 * 1000;   // reuse the saved course list for 10 minutes

function randomHex(n){
  const a = new Uint8Array(n);
  if(window.crypto && window.crypto.getRandomValues){ window.crypto.getRandomValues(a); }
  else{ for(let i = 0; i < n; i++) a[i] = Math.floor(Math.random() * 256); }
  return Array.from(a).map(b => b.toString(16).padStart(2, '0')).join('');
}
function getDeviceId(){
  try{
    let id = localStorage.getItem(DEVICE_KEY);
    if(id && /^[A-Za-z0-9-]{16,64}$/.test(id)) return id;
    id = randomHex(16);
    localStorage.setItem(DEVICE_KEY, id);
    return id;
  }catch(err){
    return 'tmp' + randomHex(12);
  }
}
function getToken(){ try{ return localStorage.getItem(TOKEN_KEY) || ''; }catch(err){ return ''; } }
function setToken(t){ try{ localStorage.setItem(TOKEN_KEY, t); }catch(err){} }
function clearToken(){ try{ localStorage.removeItem(TOKEN_KEY); }catch(err){} }

async function fetchApi(params){
  const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const timer = setTimeout(()=>{ if(ctrl) ctrl.abort(); }, 25000);
  try{
    const res = await fetch(API_URL + '?' + new URLSearchParams(params).toString(), ctrl ? { signal: ctrl.signal } : undefined);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }finally{
    clearTimeout(timer);
  }
}

function readCatalogCache(){
  try{
    const obj = JSON.parse(localStorage.getItem(CATALOG_KEY) || 'null');
    return (obj && Array.isArray(obj.rows)) ? obj : null;
  }catch(err){ return null; }
}
function writeCatalogCache(rows){
  try{ localStorage.setItem(CATALOG_KEY, JSON.stringify({ ts: Date.now(), rows: rows })); }catch(err){}
}
// "ACC 203", "ACC203" and "acc-203" are all the same course
function normKey(s){ return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }

function rowsToBank(rows){
  return rows.map(a => {
    const r = { courseCode: a[0] || '', courseTitle: (a[1] || '').replace(/\s+/g, ' ').trim(), qNumber: a[2] || '',
                year: a[3] || '', school: a[4] || '', level: a[5] || '' };
    // must match the id the backend builds from the same five fields
    r.id = [r.courseCode, r.qNumber, r.year, r.school, r.level].join('|').toLowerCase();
    r.courseKey = normKey(r.courseCode) || normKey(r.courseTitle);
    return r;
  });
}

async function loadBank(force){
  state = 'loading';
  setInputEnabled(false);
  addTyping();

  if(API_URL.indexOf('PASTE_YOUR') === 0){
    removeTyping();
    addBotMessage("The admin hasn't connected the backend yet. Paste the Web app URL into API_URL at the top of this file's code, then refresh.");
    return;
  }

  let rows = null;
  const cached = readCatalogCache();
  if(!force && cached && Date.now() - cached.ts < CATALOG_TTL_MS){
    rows = cached.rows;
  }else{
    try{
      const data = await fetchApi({ action: 'catalog' });
      if(!data.ok) throw new Error(data.error || 'bad_response');
      rows = data.rows;
      writeCatalogCache(rows);
    }catch(err){
      console.error(err);
      if(cached) rows = cached.rows;   // slow or offline: fall back to the last copy we saved
    }
  }

  if(!rows){
    removeTyping();
    addBotMessage("I couldn't load the question bank. Check your internet connection, then tap refresh.");
    return;
  }

  bank = rowsToBank(rows).filter(r => r.courseCode || r.courseTitle);
  hasYearColumn = bank.some(r => r.year);
  hasSchoolColumn = bank.some(r => r.school);
  hasLevelColumn = bank.some(r => r.level);

  if(!bank.length){
    removeTyping();
    addBotMessage("There are no questions in the bank yet. Once questions are added, tap refresh.");
    return;
  }
  await startConversation();
}

async function startConversation(){
  let status = null;
  try{
    status = await fetchApi({ action: 'status', device: getDeviceId(), token: getToken() });
  }catch(err){ /* the status line is optional */ }
  removeTyping();

  if(status && status.ok){
    if(status.tokenValid === false) clearToken();
    if(status.subscribed){
      const d = status.daysLeft;
      addBotMessage(`Welcome back! You have unlimited access for ${d} more day${d === 1 ? '' : 's'}.`);
    }else if(status.paywall && PAYSTACK_PUBLIC_KEY){
      const left = status.freeLeft;
      if(left > 0){
        addBotMessage(`You have ${left} free question${left === 1 ? '' : 's'} left on this device. After that, unlock everything for ₦${SUBSCRIPTION_PRICE_NGN.toLocaleString()} for ${SUBSCRIPTION_DAYS} days.`);
      }else{
        addBotMessage(`You've used your free questions on this device. Unlock everything for ₦${SUBSCRIPTION_PRICE_NGN.toLocaleString()} for ${SUBSCRIPTION_DAYS} days.`);
      }
      addChips(['I already paid (restore access)'], (label)=>{
        addUserMessage(label);
        startRestore();
      });
    }
  }
  askCourse();
}

function uniqueCourses(){
  const map = new Map();
  let rows = bank;
  // Narrow to the student's own school/level when the sheet actually has that data —
  // but never dead-end the student if nothing matches, just show everything instead.
  if(hasSchoolColumn && studentSchool){
    const bySchool = rows.filter(r => !r.school || r.school.toLowerCase().includes(studentSchool.toLowerCase()));
    if(bySchool.length) rows = bySchool;
  }
  if(hasLevelColumn && studentLevel){
    const byLevel = rows.filter(r => !r.level || r.level.toLowerCase() === studentLevel.toLowerCase());
    if(byLevel.length) rows = byLevel;
  }
  rows.forEach(r=>{
    if(!map.has(r.courseKey)) map.set(r.courseKey, r);
  });
  return [...map.values()];
}

function matchCourses(input){
  const qKey = normKey(input);
  if(!qKey) return [];
  // a course can appear under slightly different titles in different years: search all of them
  const titlesByKey = {};
  bank.forEach(r => { (titlesByKey[r.courseKey] = titlesByKey[r.courseKey] || []).push(normKey(r.courseTitle)); });
  return uniqueCourses().filter(r =>
    r.courseKey === qKey ||
    normKey(r.courseCode).includes(qKey) ||
    (titlesByKey[r.courseKey] || []).some(t => t.includes(qKey))
  );
}

function courseLabel(r){
  return `${r.courseCode || ''}${r.courseTitle ? (r.courseCode ? ' – ' : '') + r.courseTitle : ''}`.trim();
}

function askCourse(){
  state = 'course';
  addBotMessage(`What course would you like to study, ${studentName}? (type the course title or course code)`);
  setInputEnabled(true, "e.g. MTH101 or Linear Algebra");
}

function handleCourseInput(text){
  const matches = matchCourses(text);
  if(matches.length === 0){
    addBotMessage(`I couldn't find a course matching "${text}" in the bank. Try the exact course code, or part of the course title.`);
    return;
  }
  if(matches.length > 1){
    const shown = matches.slice(0, 12);
    addBotMessage(matches.length > 12
      ? `${matches.length} courses match "${text}". Here are the first 12, or type more of the course code or title:`
      : `A few courses match "${text}". Which one did you mean?`);
    const byLabel = new Map();
    shown.forEach(m => byLabel.set(courseLabel(m), m.courseKey));
    addChips([...byLabel.keys()], (label)=>{
      addUserMessage(label);
      selectCourse(byLabel.get(label));
    });
    return;
  }
  selectCourse(matches[0].courseKey);
}

function selectCourse(courseKey){
  currentCourseRows = bank.filter(r => r.courseKey === courseKey);
  if(!currentCourseRows.length){
    addBotMessage("Hmm, I lost track of that course. Try typing the course code again.");
    return;
  }
  currentCourseLabel = courseLabel(currentCourseRows[0]);

  if(hasYearColumn){
    askYear();
  }else{
    askQuestionNumber(currentCourseRows);
  }
}

function availableYears(){
  return [...new Set(currentCourseRows.map(r => r.year).filter(Boolean))]
    .sort((a,b)=> b.localeCompare(a, undefined, {numeric:true}));
}

function askYear(){
  state = 'year';
  const years = availableYears();
  addBotMessage(`Great, ${currentCourseLabel}. Which exam year would you like to practice?`);
  if(years.length) addChips(years.slice(0, 20), (label)=>{
    addUserMessage(label);
    handleYearInput(label);
  });
  setInputEnabled(true, "e.g. 2023");
}

function handleYearInput(text){
  const q = text.trim().toLowerCase();
  const rows = currentCourseRows.filter(r => r.year.toLowerCase() === q || r.year.toLowerCase().includes(q));
  if(!rows.length){
    const years = availableYears().join(', ');
    addBotMessage(`I couldn't find ${text} for ${currentCourseLabel}. Available years: ${years || '(none listed yet)'}`);
    return;
  }
  currentYearLabel = text.trim();
  askQuestionNumber(rows);
}

function askQuestionNumber(rows){
  currentSearchRows = rows;
  const numbers = rows.map(r => r.qNumber).filter(Boolean);
  state = 'qnum';
  addBotMessage(`Which question number would you like to practice?`);
  if(numbers.length) addChips(numbers.slice(0, 20), (label)=>{
    addUserMessage(label);
    handleQuestionNumberInput(label);
  });
  setInputEnabled(true, "e.g. 1, 2, 3a…");
}

/* ---- Questions, free limit and payment (all decided by the backend) ---- */
let restoreEmail = '';

function handleQuestionNumberInput(text){
  const q = text.trim().toLowerCase().replace(/[^a-z0-9]/g,'');
  const found = currentSearchRows.find(r => r.qNumber.toLowerCase().replace(/[^a-z0-9]/g,'') === q);
  if(!found){
    const available = currentSearchRows.map(r=>r.qNumber).filter(Boolean).join(', ');
    addBotMessage(`I couldn't find question ${text}. Available question numbers: ${available || '(none listed yet)'}`);
    return;
  }
  fetchAnswer(found);
}

async function fetchAnswer(found){
  state = 'loading-answer';
  setInputEnabled(false);
  addTyping();
  let data;
  try{
    data = await fetchApi({ action: 'get', id: found.id, device: getDeviceId(), token: getToken() });
  }catch(err){
    console.error(err);
    removeTyping();
    addBotMessage("I couldn't reach the server. Check your internet connection and try that question again.");
    state = 'qnum';
    setInputEnabled(true, "e.g. 1");
    return;
  }
  removeTyping();

  if(data.tokenValid === false) clearToken();

  if(data.ok){
    showAnswer({ ...found, question: data.question, answer: data.answer });
    if(!data.subscribed && data.paywall && data.freeLeft > 0 && data.freeLeft <= 2){
      addBotMessage(`(${data.freeLeft} free question${data.freeLeft === 1 ? '' : 's'} left on this device.)`);
    }
    return;
  }
  if(data.error === 'limit_reached'){ offerSubscription(found); return; }

  const messages = {
    not_found: "That question was just updated. Tap “↻ refresh bank” at the top, then try again.",
    busy: "Lots of students are online right now. Please try that question again in a few seconds.",
    bad_device: "Something went wrong with your session. Please refresh the page and try again."
  };
  addBotMessage(messages[data.error] || "Something went wrong on our side. Please try again in a moment.");
  state = 'qnum';
  setInputEnabled(true, "e.g. 1");
}

function offerSubscription(found){
  pendingPaidRow = found;
  if(!PAYSTACK_PUBLIC_KEY){
    addBotMessage("You've used your free questions, and subscriptions aren't open yet. Please check back soon.");
    state = 'qnum';
    setInputEnabled(true, "e.g. 1");
    return;
  }
  state = 'paywall';
  setInputEnabled(false, "Choose an option above…");
  addBotMessage(`You've used your free questions. Unlock every course for ₦${SUBSCRIPTION_PRICE_NGN.toLocaleString()} for ${SUBSCRIPTION_DAYS} days. Paystack will show you the ways you can pay (card, bank transfer and more).`);
  addChips([`Subscribe – ₦${SUBSCRIPTION_PRICE_NGN.toLocaleString()}`, 'I already paid', 'Not now'], (label)=>{
    addUserMessage(label);
    if(label.startsWith('Subscribe')){
      state = 'paywall-email';
      addBotMessage("What's your email? Paystack will send your receipt there.");
      setInputEnabled(true, "you@example.com");
    }else if(label === 'I already paid'){
      startRestore();
    }else{
      pendingPaidRow = null;
      askQuestionNumber(currentSearchRows);
    }
  });
}

function startRestore(){
  state = 'restore-email';
  addBotMessage("Okay. What email did you pay with?");
  setInputEnabled(true, "you@example.com");
}

const PAYMENT_ERRORS = {
  payment_not_found: "I couldn't find that payment.",
  payment_not_successful: "Paystack says that payment wasn't completed.",
  amount_mismatch: "That payment doesn't match the subscription amount.",
  email_mismatch: "That payment was made with a different email.",
  subscription_expired: "That subscription has expired. Tap Subscribe to renew.",
  bad_reference: "That doesn't look like a valid payment reference.",
  bad_email: "That email doesn't look right.",
  not_configured: "Payments aren't fully set up yet. Please contact support.",
  network: "I couldn't reach the server."
};
function friendlyError(code){
  return PAYMENT_ERRORS[code] || "Something went wrong on our side.";
}

// Ask the backend to confirm the payment with Paystack. It only unlocks access if Paystack agrees.
async function confirmPayment(email, reference, tries){
  let last = 'network';
  for(let attempt = 0; attempt < tries; attempt++){
    try{
      const data = await fetchApi({ action: 'verify', email: email, reference: reference, device: getDeviceId() });
      if(data.ok){ setToken(data.token); return { ok: true, daysLeft: data.daysLeft }; }
      last = data.error || 'server_error';
      const retryable = (last === 'payment_not_found' || last === 'payment_not_successful' || last === 'server_error');
      if(!retryable) break;
    }catch(err){
      last = 'network';
    }
    if(attempt < tries - 1) await new Promise(r => setTimeout(r, 2500));
  }
  return { ok: false, error: last };
}

async function handlePaymentSuccess(email, reference){
  state = 'confirming';
  setInputEnabled(false);
  addBotMessage("Payment received. Confirming it now…");
  addTyping();
  const r = await confirmPayment(email, reference, 3);
  removeTyping();
  if(r.ok){
    rememberEmail(email);
    addBotMessage(`You're in! You now have unlimited access for ${r.daysLeft} days.\n\nSave this payment reference in case you switch phones:\n${reference}`);
    const row = pendingPaidRow;
    pendingPaidRow = null;
    if(row){ await fetchAnswer(row); } else { askCourse(); }
  }else{
    addBotMessage(`Your payment went through, but I couldn't confirm it yet (${friendlyError(r.error)}). Please don't pay again.\n\nYour payment reference:\n${reference}`);
    addChips(['Try confirming again'], ()=>{
      handlePaymentSuccess(email, reference);
    });
  }
}

async function restoreAccess(email, reference){
  addTyping();
  const r = await confirmPayment(email, reference.trim(), 1);
  removeTyping();
  if(r.ok){
    rememberEmail(email);
    addBotMessage(`Access restored. You have unlimited access for ${r.daysLeft} more days.`);
    const row = pendingPaidRow;
    pendingPaidRow = null;
    if(row){ await fetchAnswer(row); } else { askCourse(); }
  }else{
    addBotMessage(`${friendlyError(r.error)} Please check the email and reference, then try again.`);
    state = 'paywall';
    setInputEnabled(false, "Choose an option above…");
    addChips(['Try again', 'Cancel'], (label)=>{
      addUserMessage(label);
      if(label === 'Try again'){ startRestore(); }
      else{ pendingPaidRow = null; askCourse(); }
    });
  }
}

function showAnswer(found){
  addQACard(found);
  state = 'next';
  addBotMessage("What next?");
  const options = ['Another question'];
  if(hasYearColumn) options.push('Different year, same course');
  options.push('Different course');
  addChips(options, (label)=>{
    addUserMessage(label);
    if(label === 'Another question'){
      askQuestionNumber(currentSearchRows);
    }else if(label.startsWith('Different year')){
      askYear();
    }else{
      askCourse();
    }
  });
  setInputEnabled(true, "Type here, or use the buttons above…");
}

function startPaystackCheckout(email){
  if(typeof PaystackPop === 'undefined'){
    addBotMessage("Couldn't open the payment checkout. This can happen if an ad-blocker or browser privacy setting is blocking Paystack's script, or if there's a connection issue. Try turning off any ad-blocker, or switch to a different browser, then try again.");
    state = 'qnum';
    setInputEnabled(true, "e.g. 1");
    return;
  }
  const reference = 'pastq-' + randomHex(12);
  try{
    state = 'paying';
    const handler = PaystackPop.setup({
      key: PAYSTACK_PUBLIC_KEY,
      email: email,
      amount: SUBSCRIPTION_PRICE_NGN * 100, // kobo
      currency: 'NGN',
      ref: reference,
      callback: function(response){
        handlePaymentSuccess(email, reference);
      },
      onClose: function(){
        if(state !== 'paying') return;   // already paid: nothing to cancel
        addBotMessage("No worries. You can subscribe any time you're ready. Pick a different question, or try again?");
        state = 'qnum';
        setInputEnabled(true, "e.g. 1");
      }
    });
    handler.openIframe();
  }catch(err){
    addBotMessage("Something went wrong opening the payment checkout. Please check your internet connection and try again.");
    state = 'qnum';
    setInputEnabled(true, "e.g. 1");
    console.error('Paystack checkout failed:', err);
  }
}

form.addEventListener('submit', (e)=>{
  e.preventDefault();
  const text = textInput.value.trim();
  if(!text) return;
  addUserMessage(text);
  textInput.value = '';

  if(state === 'course'){
    handleCourseInput(text);
  }else if(state === 'year'){
    handleYearInput(text);
  }else if(state === 'qnum'){
    handleQuestionNumberInput(text);
  }else if(state === 'paywall-email'){
    if(!/^\S+@\S+\.\S+$/.test(text)){
      addBotMessage("That doesn't look like a valid email — try again?");
      return;
    }
    setInputEnabled(false);
    startPaystackCheckout(text);
  }else if(state === 'restore-email'){
    if(!/^\S+@\S+\.\S+$/.test(text)){
      addBotMessage("That doesn't look like a valid email — try again?");
      return;
    }
    restoreEmail = text;
    state = 'restore-ref';
    addBotMessage("Now paste your payment reference. You'll find it in your Paystack receipt email (it starts with “pastq-”), or in the message you saw right after you paid.");
    setInputEnabled(true, "pastq-…");
  }else if(state === 'restore-ref'){
    setInputEnabled(false);
    restoreAccess(restoreEmail, text);
  }else if(state === 'next'){
    const lower = text.toLowerCase();
    if(lower.includes('different') && lower.includes('year') && hasYearColumn){
      askYear();
    }else if(lower.includes('course')){
      askCourse();
    }else{
      askQuestionNumber(currentSearchRows);
    }
  }
});

refreshBtn.addEventListener('click', ()=>{
  chatLog.innerHTML = '';
  loadBank(true);
});

/* ---- Answer protection: no copy, long-press menu, drag or right-click on answers ---- */
if(PROTECT_ANSWERS){
  ['contextmenu', 'copy', 'cut', 'dragstart'].forEach(evt => {
    document.addEventListener(evt, (e)=>{
      const t = e.target;
      if(t && t.closest && t.closest('.qa-card')) e.preventDefault();
    });
  });
}

/* ---- Login / profile handling ---- */
const PROFILE_KEY = 'pastq_profile';

function enterApp(){
  loginScreen.hidden = true;
  appScreen.hidden = false;
  chatLog.innerHTML = '';
  loadBank();
}

function loadSavedProfile(){
  try{
    const raw = localStorage.getItem(PROFILE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(err){
    return null;
  }
}

function saveProfile(profile){
  try{ localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); }catch(err){ /* storage unavailable, fine to skip */ }
}

loginForm.addEventListener('submit', (e)=>{
  e.preventDefault();
  studentName = loginName.value.trim().split(' ')[0];
  studentLevel = loginLevel.value;
  studentSchool = loginSchool.value.trim();
  saveProfile({ name: studentName, level: studentLevel, school: studentSchool });
  enterApp();
});

changeProfileBtn.addEventListener('click', ()=>{
  appScreen.hidden = true;
  loginScreen.hidden = false;
  loginName.value = studentName;
  loginLevel.value = studentLevel;
  loginSchool.value = studentSchool;
});

const savedProfile = loadSavedProfile();
if(savedProfile && savedProfile.name){
  studentName = savedProfile.name;
  studentLevel = savedProfile.level || '';
  studentSchool = savedProfile.school || '';
  enterApp();
}else{
  loginScreen.hidden = false;
  appScreen.hidden = true;
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* fine if this fails before hosting */ });
  });
}

/* ---- Install banner: pure instructions, no fragile browser API involved ---- */
const installBanner = document.getElementById('installBanner');
const installBannerText = document.getElementById('installBannerText');
const dismissInstallBtn = document.getElementById('dismissInstallBtn');
const INSTALL_DISMISSED_KEY = 'pastq_install_dismissed';

function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isPermanentlyDismissed(){
  return localStorage.getItem(INSTALL_DISMISSED_KEY) === '1';
}
function isIos(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent);
}

if(isStandalone()){
  // Genuinely running as an installed app right now — remember that so the
  // banner never reappears on this device again, even from a browser tab later.
  try{ localStorage.setItem(INSTALL_DISMISSED_KEY, '1'); }catch(err){}
}else if(!isPermanentlyDismissed()){
  installBannerText.textContent = isIos()
    ? '📲 To install: tap Share, then "Add to Home Screen"'
    : '📲 To install: tap ⋮ (menu), then "Install app" or "Add to Home screen"';
  installBanner.hidden = false;
}

dismissInstallBtn.addEventListener('click', () => {
  installBanner.hidden = true;
  try{ localStorage.setItem(INSTALL_DISMISSED_KEY, '1'); }catch(err){}
});

window.addEventListener('appinstalled', () => {
  installBanner.hidden = true;
  try{ localStorage.setItem(INSTALL_DISMISSED_KEY, '1'); }catch(err){}
});
